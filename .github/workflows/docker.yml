name: Build and Publish Docker images

on:
  # Ручной запуск. Когда Actions не создаёт прогоны по пушу (так было
  # 6 августа), собрать образ иначе нечем — в GHCR у релиза другого пути нет.
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      # Релизные теги идут без префикса «v» (4.0.2) — шаблон v* их не ловил,
      # и пуш тега молча не собирал ничего. Здесь glob, а не regex: шаблон
      # намеренно простой, потому что промах означает несобранный релиз.
      - "[0-9]*"
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image_suffix: ""
            context: .
            dockerfile: ./Dockerfile
          - image_suffix: "-web-backend"
            context: .
            dockerfile: ./web/backend/Dockerfile
          - image_suffix: "-web-frontend"
            context: ./web/frontend
            dockerfile: ./web/frontend/Dockerfile
          - image_suffix: "-node-agent"
            context: ./node-agent
            dockerfile: ./node-agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name (lowercase owner)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remnawave-admin${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Determine image tags and platforms
        id: metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          if [ "$REF_NAME" = "dev" ]; then
            IMAGE_TAG=dev
            PLATFORMS=linux/amd64
          else
            IMAGE_TAG=latest
            PLATFORMS=linux/amd64,linux/arm64
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Invalid version tag: $REF_NAME" >&2
              exit 1
            fi
            if [ "$VERSION" != "$(cat VERSION)" ]; then
              echo "Tag $VERSION does not match VERSION $(cat VERSION)" >&2
              exit 1
            fi
          fi

          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            if [ -n "${VERSION:-}" ]; then
              echo "${IMAGE_NAME}:${VERSION}"
            fi
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "PLATFORMS=$PLATFORMS" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.metadata.outputs.IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
